[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "teacher-prep-agent"
version = "0.1.0"
description = "Teacher-led lesson generation and evidence-based revision tools for the DSH teacher workbench"
requires-python = ">=3.12"
dependencies = ["pydantic==2.10.4", "python-pptx==1.0.2", "python-docx==1.2.0", "pypdf==6.16.2"]

[project.scripts]
teacher-prep = "teacher_prep.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"

